<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Saranya Portfolio</title>

    <meta name="description" content="Get in touch with saranya for projects, collaborations, or job opportunities.">
</head>
<body>

<header>
    <h1>Contact Me</h1>

    <nav aria-label="Contact Navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
        </ul>
    </nav>
</header>

<main>

<section aria-labelledby="contact-heading">

    <h2 id="contact-heading">Get In Touch</h2>

    <p>
        Feel free to contact me regarding internships,
        freelance work, collaborations, or web development projects.
    </p>

    <form action="#" method="post" aria-label="Contact Form">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                required
                aria-required="true">

            <br><br>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                aria-required="true">

        </fieldset>

        <br>

        <fieldset>
            <legend>Your Message</legend>

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                name="subject">

            <br><br>

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="6"
                required
                aria-required="true"></textarea>
        </fieldset>

        <br>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</main>

<footer>
    <p>&copy; 2026 Saranya. All Rights Reserved.</p>
</footer>

</body>
</html>
